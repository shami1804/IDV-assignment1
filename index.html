<!DOCTYPE html>
<html>
<head>
    <title>PSI API Test</title>
</head>

<body>

    <h1>Singapore PSI Data</h1>

    <script>
        const apiURL =
            "https://api-production.data.gov.sg/v2/public/api/datasets/d_fe37906a0182569d891506e815e819b7/list-rows";

        fetch(apiURL)
            .then(response => {
                console.log("Status:", response.status);
                console.log("Response OK:", response.ok);

                return response.text();
            })
            .then(text => {
                console.log("API Response:");
                console.log(text);
            })
            .catch(error => {
                console.error("Error:", error);
            });
    </script>

</body>
</html>
