<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Singapore PSI Data</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f5f7fa;
            color: #222;
        }

        h1 {
            text-align: center;
            color: #123456;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .psi-box {
            max-width: 500px;
            margin: 0 auto 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .psi-box h2 {
            margin-top: 0;
        }

        #psiValue {
            font-size: 55px;
            font-weight: bold;
            color: #16803c;
        }

        table {
            width: 100%;
            max-width: 900px;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        th {
            background-color: #123456;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f6fa;
        }

        .error {
            color: red;
            text-align: center;
            font-weight: bold;
        }

        .updated {
            text-align: center;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Singapore PSI Data</h1>

    <p class="subtitle">
        Real-time Pollutant Standards Index readings from data.gov.sg
    </p>

    <div class="status" id="status">
        Loading data...
    </div>

    <div class="psi-box">
        <h2>Current PSI</h2>

        <div id="psiValue">
            --
        </div>

        <div id="psiStatus">
            Loading...
        </div>
    </div>

    <table>

        <thead>
            <tr>
                <th>No.</th>
                <th>Reading Name</th>
                <th>Value</th>
            </tr>
        </thead>

        <tbody id="psiTable">

            <tr>
                <td colspan="3">
                    Loading PSI data...
                </td>
            </tr>

        </tbody>

    </table>

    <p class="updated" id="updatedTime"></p>


    <script>

        // Real-time PSI API
        const API_URL =
            "https://api-open.data.gov.sg/v2/real-time/api/psi";


        // The 12 required PSI readings
        const readings = [
            "o3_sub_index",
            "pm10_twenty_four_hourly",
            "pm10_sub_index",
            "co_sub_index",
            "pm25_twenty_four_hourly",
            "so2_sub_index",
            "co_eight_hour_max",
            "no2_one_hour_max",
            "so2_twenty_four_hourly",
            "pm25_sub_index",
            "psi_twenty_four_hourly",
            "o3_eight_hour_max"
        ];


        // Get the value from a reading
        function getValue(reading) {

            if (!reading) {
                return "N/A";
            }

            // If API gives a national value
            if (reading.national !== undefined) {
                return reading.national;
            }

            // Otherwise show regional values
            return Object.entries(reading)
                .map(function ([region, value]) {
                    return region + ": " + value;
                })
                .join(" | ");
        }


        // Decide PSI air-quality status
        function getPSIStatus(psi) {

            if (psi <= 50) {
                return "Good";
            }

            if (psi <= 100) {
                return "Moderate";
            }

            if (psi <= 200) {
                return "Unhealthy";
            }

            if (psi <= 300) {
                return "Very Unhealthy";
            }

            return "Hazardous";
        }


        // Load PSI data
        async function loadPSI() {

            const status =
                document.getElementById("status");

            const table =
                document.getElementById("psiTable");

            status.textContent =
                "Loading latest PSI data...";


            try {

                // Send request to API
                const response =
                    await fetch(API_URL);


                // Check response
                if (!response.ok) {

                    throw new Error(
                        "API Error: " + response.status
                    );

                }


                // Convert response to JSON
                const data =
                    await response.json();


                console.log("API Response:", data);


                // Get first/latest item
                const item =
                    data.data.items[0];


                // Get readings
                const readingsData =
                    item.readings;


                // Get PSI
                const psiReading =
                    readingsData.psi_twenty_four_hourly;


                const psi =
                    getValue(psiReading);


                // Display PSI
                document.getElementById(
                    "psiValue"
                ).textContent = psi;


                // Display PSI status
                if (
                    psiReading &&
                    psiReading.national !== undefined
                ) {

                    document.getElementById(
                        "psiStatus"
                    ).textContent =
                        getPSIStatus(
                            psiReading.national
                        );

                } else {

                    document.getElementById(
                        "psiStatus"
                    ).textContent =
                        "Latest reading";

                }


                // Clear table
                table.innerHTML = "";


                // Add all 12 readings
                readings.forEach(
                    function (readingName, index) {

                        const value =
                            getValue(
                                readingsData[readingName]
                            );


                        const row =
                            document.createElement("tr");


                        row.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${readingName}</td>
                            <td>${value}</td>
                        `;


                        table.appendChild(row);

                    }
                );


                // Display update time
                const updateTime =
                    new Date(
                        item.update_timestamp
                    );


                document.getElementById(
                    "updatedTime"
                ).textContent =
                    "Last updated: " +
                    updateTime.toLocaleString();


                status.textContent =
                    "✓ Data successfully loaded";


            } catch (error) {

                console.error(
                    "Error loading PSI:",
                    error
                );


                status.textContent =
                    "Unable to load PSI data";


                table.innerHTML = `
                    <tr>
                        <td colspan="3" class="error">
                            Error loading data.
                            Please refresh the page.
                        </td>
                    </tr>
                `;

            }

        }


        // Load data when page opens
        loadPSI();


        // Refresh data every 15 minutes
        setInterval(
            loadPSI,
            15 * 60 * 1000
        );

    </script>

</body>

</html>
