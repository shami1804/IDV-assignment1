<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Singapore Air Quality</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5fa;
      color: #0B2348;
    }

    .background {
      position: fixed;
      width: 100%;
      height: 100%;
      object-fit: cover;
      top: 0;
      left: 0;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: rgba(240, 247, 252, 0.45);
      z-index: -1;
    }

    .page {
      width: 90%;
      max-width: 1150px;
      margin: auto;
      padding-top: 6%;
      padding-bottom: 60px;
    }

    header {
      margin-bottom: 35px;
    }

    h1 {
      margin: 0;
      font-size: 40px;
    }

    .subtitle {
      margin-top: 12px;
      color: #65738A;
      font-size: 20px;
    }

    .source {
      color: #65738A;
      font-size: 13px;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      padding: 8px 15px;
      border-radius: 20px;
      background: white;
      color: #16803c;
      font-size: 13px;
      font-weight: bold;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #22a447;
      border-radius: 50%;
    }

    .regional-card,
    .table-card {
      padding: 22px;
      margin-bottom: 22px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(40, 70, 100, 0.12);
    }

    .regional-card h2,
    .table-header h2 {
      margin-top: 0;
      color: #0B2348;
    }

    .regions {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .region {
      padding: 15px;
      text-align: center;
      border: 1px solid #dce7f0;
      border-radius: 15px;
      background: #f6faff;
    }

    .region-name {
      font-weight: bold;
      font-size: 14px;
    }

    .region-value {
      margin-top: 7px;
      font-size: 28px;
      font-weight: bold;
      color: #209447;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    button {
      padding: 9px 17px;
      border: none;
      border-radius: 20px;
      background: #eaf4ff;
      color: #1475d1;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d8ecff;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 750px;
      border-collapse: collapse;
    }

    th {
      padding: 13px;
      background: #249447;
      color: white;
      text-align: left;
      font-size: 14px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e2e8ef;
      color: #475467;
      font-size: 14px;
    }

    .loading,
    .error {
      text-align: center;
      padding: 20px;
    }

    .loading {
      color: #65738A;
    }

    .error {
      color: #c62828;
    }

    @media (max-width: 800px) {
      .page {
        width: 92%;
        padding-top: 35px;
      }

      h1 {
        font-size: 34px;
      }

      .subtitle {
        font-size: 18px;
      }

      .regions {
        grid-template-columns: repeat(2, 1fr);
      }

      .table-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <img src="bg.png" class="background" alt="">
  <div class="overlay"></div>

  <main class="page">

    <header>
      <h1>Singapore Air Quality</h1>

      <h2 class="subtitle">
        Real-time PSI and Pollutant Readings
      </h2>

      <p class="source">
        Data from <strong>data.gov.sg</strong> • Updated in real time
      </p>

      <div class="live">
        <span class="live-dot"></span>
        LIVE DATA
      </div>
    </header>

    <section class="table-card">

      <div class="table-header">
        <h2>All 12 API Readings</h2>

        <button onclick="loadPSI()">
          ↻ Refresh Data
        </button>
      </div>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>No.</th>
              <th>Reading Name</th>
              <th>North</th>
              <th>South</th>
              <th>East</th>
              <th>West</th>
              <th>Central</th>
            </tr>
          </thead>

          <tbody id="psiTable">
            <tr>
              <td colspan="7" class="loading">
                Loading PSI data...
              </td>
            </tr>
          </tbody>

        </table>

      </div>

    </section>

  </main>

  <script>

    const API_URL = "https://api-open.data.gov.sg/v2/real-time/api/psi";

    const readings = [
      "o3_sub_index",
      "pm10_twenty_four_hourly",
      "pm10_sub_index",
      "co_sub_index",
      "pm25_twenty_four_hourly",
      "so2_sub_index",
      "co_eight_hour_max",
      "no2_one_hour_max",
      "so2_twenty_four_hourly",
      "pm25_sub_index",
      "psi_twenty_four_hourly",
      "o3_eight_hour_max"
    ];
function formatName(name) {
      return name
        .replaceAll("_", " ")
        .replace("twenty four", "24")
        .replace("eight hour", "8 hour")
        .replace("one hour", "1 hour");
    }
    const regions = ["north", "south", "east", "west", "central"];

    async function loadPSI() {

      const table = document.getElementById("psiTable");

      table.innerHTML = `
        <tr>
          <td colspan="7" class="loading">
            Loading latest PSI data...
          </td>
        </tr>
      `;

      try {

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("API error");
        }

        const data = await response.json();
        const item = data.data.items[0];
        const readingsData = item.readings;
table.innerHTML = "";

        readings.forEach(function(readingName, index) {

          const reading = readingsData[readingName];

          const row = document.createElement("tr");

          let rowData = `
            <td>${index + 1}</td>
            <td>${formatName(readingName)}</td>
          `;

          regions.forEach(function(region) {

            let value = "N/A";

            if (reading && reading[region] !== undefined) {
              value = reading[region];
            }

            rowData += `<td>${value}</td>`;
          });

          row.innerHTML = rowData;
          table.appendChild(row);

        });

      } catch (error) {

        table.innerHTML = `
          <tr>
            <td colspan="7" class="error">
              Unable to load PSI data.
            </td>
          </tr>
        `;
      }
    }

    loadPSI();

    setInterval(function() {
      loadPSI();
    }, 15 * 60 * 1000);

  </script>

</body>
</html>
